name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Install once, verify the workspace resolves ─────────────────────
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (workspace, legacy peer deps)
        run: npm install --legacy-peer-deps

  # ── Typecheck the agent runtime ─────────────────────────────────────
  typecheck-agent:
    runs-on: ubuntu-latest
    needs: install
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (workspace, legacy peer deps)
        run: npm install --legacy-peer-deps
      - name: Typecheck agent runtime
        run: npx --workspace apps/agent tsc -p apps/agent/tsconfig.json --noEmit

  # ── Typecheck the web app (no-op safe if script missing) ────────────
  typecheck-web:
    runs-on: ubuntu-latest
    needs: install
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (workspace, legacy peer deps)
        run: npm install --legacy-peer-deps
      - name: Typecheck web app
        run: npm --workspace apps/web run typecheck --if-present

  # ── Tests (vitest); tolerated no-op until suites exist ──────────────
  test:
    runs-on: ubuntu-latest
    needs: install
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (workspace, legacy peer deps)
        run: npm install --legacy-peer-deps
      - name: Run tests
        run: npm test --if-present --workspaces

  # ── Build the agent runtime (tsc emit) ──────────────────────────────
  build-agent:
    runs-on: ubuntu-latest
    needs: [typecheck-agent, test]
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (workspace, legacy peer deps)
        run: npm install --legacy-peer-deps
      - name: Build agent runtime
        run: npm --workspace apps/agent run build
