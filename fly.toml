# fly.toml app configuration file generated for ton-agent-runtime on 2026-07-15T20:55:38+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ton-agent-runtime'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/app/data'
  HEALTH_PORT = '9090'
  NODE_ENV = 'production'

[[mounts]]
  source = 'ton_agent_data'
  destination = '/app/data'

[[services]]
  protocol = 'tcp'
  internal_port = 9090

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 10

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
